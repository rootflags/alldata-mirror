# ---- TEMPLATE ONLY: editing this copy changes nothing ----------------------------------------------------
# Your settings are in ~/.alldata-mirror/alldata-mirror.conf, which setup.sh makes from this file.  crawl.py
# and build.py read that one, so change them there (or run setup.sh again to be asked).
# ---- (setup.sh leaves this box out of your copy) ---------------------------------------------------------

# alldata-mirror settings.  The vehicle ID is given on the command line (crawl.py 57903), not here.

[crawl]
# Seconds to wait before following the next link.  Pages are followed one at a time, like a person
# clicking through the site; a page's own images load straight away with no pause.  A fixed number, or
# MIN-MAX for a random pause each time.  Going much faster is not recommended: ALLDATA uses bot protection.
delay = 5.01-6.99

# Where mirrors are written.  Each vehicle gets its own folder, ie: ~/alldata-download/57903/
# Point it into a web server's folder to publish the mirrors there (see README.md).
output = ~/alldata-download

# Your my.alldata.com session cookies, copied from the browser (see README.md).  Keep this file private.
cookies = ~/.alldata-mirror/cookies.txt
